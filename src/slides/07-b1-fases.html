<section class="slide" data-id="b1-fases" data-title="Las 5 fases del pentest" data-tag="Bloque 1 · Fundamentos" data-band="Bloque 1 · Fundamentos y marco" data-steps="5" data-notes="Un pentest típico sigue 5 fases: reconocimiento, escaneo y enumeración, explotación, post-explotación y elaboración de informes.|Pulsa → para recorrerlas: el punto amarillo viaja de una fase a otra.|1 Reconocimiento: recopilar información del objetivo (dominios, IPs, tecnologías, empleados). 2 Escaneo y enumeración: puertos abiertos, servicios activos y posibles vulnerabilidades con herramientas automatizadas. 3 Explotación: intento controlado de aprovechar las vulnerabilidades para comprobar su impacto real. 4 Post-explotación: hasta dónde podría llegar un atacante (escalada de privilegios, movimiento lateral). 5 Elaboración de informes: hallazgos, evidencias y recomendaciones de remediación.|Las herramientas y el objetivo de cada fase vienen de la tabla 5.1 de la investigación; las herramientas se explican en los bloques 2, 3 y 4 y en el bloque 5 volvemos a este flujo completo.|Se conecta con la actividad A2: ordenar las fases.">
